services:
  db:
    image: postgres:16-alpine
    container_name: querypilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: querypilot
      POSTGRES_PASSWORD: querypilot_dev
      POSTGRES_DB: querypilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypilot -d querypilot"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
