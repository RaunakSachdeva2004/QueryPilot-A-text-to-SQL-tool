[project]
name = "querypilot"
version = "0.1.0"
description = "A production-oriented text-to-SQL + clarification engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "psycopg[binary]>=3.2.0,<4.0",
    "alembic>=1.14.0,<2.0",
    "sqlglot>=26.0.0,<27.0",
    "langgraph>=0.4.0,<1.0",
    "langgraph-checkpoint-postgres>=2.0.0,<3.0",
    "langchain-core>=0.3.0,<1.0",
    "langchain-anthropic>=0.3.0,<1.0",
    "langchain-openai>=0.3.0,<1.0",
    "python-dotenv>=1.0.0,<2.0",
    "structlog>=24.0.0,<25.0",
    "httpx>=0.27.0,<1.0",
    "streamlit>=1.40.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "ruff>=0.8.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring a running database",
    "security: marks SQL security tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
