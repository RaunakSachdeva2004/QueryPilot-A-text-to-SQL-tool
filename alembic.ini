# A generic, single database configuration.

[alembic]
# Path to migration environment
script_location = migrations

# SQLAlchemy URL — overridden by env.py to use app config
sqlalchemy.url = postgresql+psycopg://querypilot:querypilot_dev@localhost:5432/querypilot

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
